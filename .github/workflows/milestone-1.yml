name: OmniPoint integration tests
on: [push, pull_request]

permissions:
  contents: read

jobs:
  durability:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: omnipoint_test_admin
          POSTGRES_PASSWORD: local-test-admin-only
          POSTGRES_DB: omnipoint_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U omnipoint_test_admin -d omnipoint_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      OMNI_TEST_DISPOSABLE: '1'
      OMNI_TEST_ADMIN_URL: postgresql://omnipoint_test_admin:local-test-admin-only@127.0.0.1:55432/omnipoint_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Record candidate and runtime
        run: |
          mkdir -p "$RUNNER_TEMP/omnipoint-evidence"
          git rev-parse HEAD | tee "$RUNNER_TEMP/omnipoint-evidence/commit.txt"
          node --version
          npm --version
      - name: Run integration journeys and upgrades
        run: npm test 2>&1 | tee "$RUNNER_TEMP/omnipoint-evidence/integration.log"
      - name: Mount disposable storage fault filesystem
        run: |
          storage_root="$RUNNER_TEMP/omnipoint-storage-full"
          mkdir "$storage_root"
          sudo mount -t tmpfs -o size=32m,mode=1777 tmpfs "$storage_root"
          echo "OMNI_STORAGE_FAULT_ROOT=$storage_root" >> "$GITHUB_ENV"
      - name: Verify real filesystem exhaustion and recovery
        run: npm run test:storage 2>&1 | tee "$RUNNER_TEMP/omnipoint-evidence/storage.log"
      - name: Unmount storage fixture
        if: always()
        run: |
          storage_root="$RUNNER_TEMP/omnipoint-storage-full"
          if mountpoint -q "$storage_root"; then sudo umount "$storage_root"; fi
          if [ -d "$storage_root" ]; then rmdir "$storage_root"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ github.sha }}
          path: ${{ runner.temp }}/omnipoint-evidence
